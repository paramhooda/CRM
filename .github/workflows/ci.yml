name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Lint, typecheck, unit, API and browser tests from an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/test-all.sh
      - name: Keep the browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            playwright-report
            test-results
            docs/screenshots
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t progression-crm:ci .
